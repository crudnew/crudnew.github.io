<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- Dark Mode + High Contrast -->
  <rect width="1200" height="675" fill="#000000"/>
  <!-- Nav bar -->
  <rect width="1200" height="56" fill="#000000"/>
  <rect width="1200" height="2" y="56" fill="#ffffff"/>
  <rect x="32" y="18" width="100" height="20" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="900" y="18" width="60" height="20" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="970" y="18" width="60" height="20" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="1040" y="18" width="60" height="20" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Hero card -->
  <rect x="60" y="80" width="1080" height="340" rx="16" fill="#0a0a0a"/>
  <rect x="60" y="80" width="1080" height="340" rx="16" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="200" y="140" width="800" height="220" rx="10" fill="#111111"/>
  <rect x="200" y="140" width="800" height="220" rx="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Hero text hints -->
  <rect x="320" y="180" width="560" height="32" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="240" y="230" width="720" height="52" rx="4" fill="#ffffff" opacity="0.95"/>
  <rect x="360" y="300" width="480" height="18" rx="3" fill="#ffffff" opacity="0.5"/>
  <!-- Cards -->
  <rect x="60" y="460" width="1080" height="160" rx="12" fill="#0a0a0a"/>
  <rect x="60" y="460" width="1080" height="160" rx="12" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Label -->
  <text x="600" y="636" font-family="monospace" font-size="13" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="3">DARK + HIGH CONTRAST</text>
</svg>
